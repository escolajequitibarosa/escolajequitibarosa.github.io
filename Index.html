<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu saldo de horas extras</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#e1e4ea;--ac:#1f5eff;--pos:#0a7d3b;--neg:#c42b1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171d;--card:#1d222b;--tx:#eef0f4;--mut:#9aa3b2;--bd:#2c3340;--ac:#6f9bff;--pos:#4ccd88;--neg:#ff7a6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171d;--card:#1d222b;--tx:#eef0f4;--mut:#9aa3b2;--bd:#2c3340;--ac:#6f9bff;--pos:#4ccd88;--neg:#ff7a6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
select,input,button{font:inherit;width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input{letter-spacing:.15em;text-transform:uppercase}
button{background:var(--ac);color:#fff;border:0;margin-top:16px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd);width:auto;margin:0;padding:6px 14px}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--neg);margin:12px 0 0;min-height:1.2em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big{font-size:2.2rem;font-weight:700;margin:6px 0 0}.pos{color:var(--pos)}.neg{color:var(--neg)}
.sit{color:var(--mut)}.w{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:.9rem;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:600}
td.o{white-space:normal;min-width:180px}.hide{display:none}
</style></head><body><main>
<h1>Meu saldo de horas extras</h1>
<p class="s">Escolha seu nome e digite o código pessoal que você recebeu. Cada código abre somente os dados do próprio professor.</p>

<label for="nm">Nome</label><select id="nm"></select>
<label for="cd">Código de acesso</label><input id="cd" autocomplete="off" placeholder="XXXX-XXXX" maxlength="9">
<button id="go">Ver meus dados</button><div id="err" role="alert"></div></div>
<div class="card hide" id="res">
<div class="top"><div><div id="rn" style="font-weight:600"></div><div class="sit" id="rt"></div></div><button class="g" id="out">Sair</button></div>
<div class="big" id="rs"></div><div class="sit">Saldo final de horas</div>

D.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.n;$("nm").appendChild(o)});
async function dec(b64,code){
 const r=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:r.slice(0,16),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:r.slice(16,28)},k,r.slice(28));
 return JSON.parse(new TextDecoder().decode(pt));
}
function show(d){
 $("rn").textContent=d.n;$("rt").textContent=d.t;
 const s=$("rs");s.textContent=d.s||"0:00";s.className="big "+(d.s&&d.s[0]==="-"?"neg":(d.s&&d.s!=="0:00"?"pos":""));
 const tb=$("tb");tb.textContent="";
 d.l.forEach(l=>{const tr=document.createElement("tr");l.forEach((v,j)=>{const td=document.createElement("td");td.textContent=v;if(j===7)td.className="o";tr.appendChild(td)});tb.appendChild(tr)});
 $("emp").textContent=d.l.length?"":"Nenhum lançamento registrado até o momento.";
 $("login").classList.add("hide");$("res").classList.remove("hide");
}
$("go").onclick=async()=>{
 const b=$("go"),e=$("err");e.textContent="";
 const c=$("cd").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(c.length!==8){e.textContent="Digite o código completo (8 caracteres).";return}
 b.disabled=true;b.textContent="Verificando...";
 try{show(await dec(D[$("nm").value].b,c))}
 catch(x){e.textContent="Nome ou código incorreto."}
 b.disabled=false;b.textContent="Ver meus dados";
};
$("cd").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("out").onclick=()=>{$("res").classList.add("hide");$("login").classList.remove("hide");$("cd").value="";$("tb").textContent=""};
